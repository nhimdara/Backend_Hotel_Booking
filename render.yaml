services:
  - type: web
    name: backend-hotel-booking
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: StayEasy API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-booking-db
          property: connectionString
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: hotel-booking-db
    plan: free
    databaseName: hotel_booking
    user: hotel_booking
